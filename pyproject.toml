[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-stack-updater"
version = "0.2.3"
description = "Least-privilege Portainer stack update monitor with health-gated rollback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/frankieramirez/nas-stack-updater"
Issues = "https://github.com/frankieramirez/nas-stack-updater/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
nas-stack-updater = "nas_stack_updater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
