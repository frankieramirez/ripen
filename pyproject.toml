[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ripen"
version = "0.3.0"
description = "Fail-closed image updates for Portainer. A digest ripens. You apply."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/frankieramirez/ripen"
Issues = "https://github.com/frankieramirez/ripen/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
ripen = "ripen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
