name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: .github/ci/changed-halves.sh

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        run: go test -race ./...

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-linux-amd64
          path: dist/ripen_linux_amd64_v1/ripen

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snapshot-linux-amd64
      - name: Write a minimal policy
        run: |
          mkdir -p smoke
          cat > smoke/policy.yaml <<'POLICY'
          mode: monitor
          state_file: smoke/state/ripen.db
          stacks:
            example:
              enabled: false
              backend: docker-compose
              file: smoke/compose.yaml
              expected_services:
                - web
              health:
                target: http://127.0.0.1:9/health
          POLICY
          printf 'services:\n  web:\n    image: ghcr.io/example/web:1.0.0\n' > smoke/compose.yaml
      - name: Run version, schema, and status
        run: |
          chmod +x ./ripen
          ./ripen version
          ./ripen schema > /dev/null
          ./ripen status --config smoke/policy.yaml

  nix:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Check the lock is still tracking nixpkgs
        run: |
          locked="$(jq -r '.nodes.nixpkgs.locked.lastModified' flake.lock)"
          age=$(( ( $(date -u +%s) - locked ) / 86400 ))
          echo "nixpkgs in flake.lock is $age days old"
          if [ "$age" -gt 45 ]; then
            echo "flake.lock has not been bumped in $age days, so the nix channel is" >&2
            echo "building against a stale nixpkgs and no longer picks up go patch" >&2
            echo "releases. check .github/workflows/flake-lock.yaml is still running;" >&2
            echo "github disables scheduled workflows after 60 days of inactivity." >&2
            exit 1
          fi

      - name: Build the flake
        run: nix build .#ripen --print-build-logs
      - name: Check the built binary reports what the flake built
        run: |
          reported="$(./result/bin/ripen version)"
          echo "$reported"
          expected="$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix)"
          if ! printf '%s' "$reported" | grep -q "\"ripen\":\"$expected\""; then
            echo "version verb does not report $expected" >&2
            exit 1
          fi
          if printf '%s' "$reported" | grep -q '"commit":"none"'; then
            echo "the build stamped no commit" >&2
            exit 1
          fi
          ./result/bin/ripen schema > /dev/null
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan what the flake actually built
        run: |
          ./.github/ci/check-nix-vulnerabilities.sh \
            ./result/bin/ripen .github/nix-vuln-baseline.txt

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Check types
        working-directory: site
        run: npm run check
      - name: Build
        working-directory: site
        run: npm run build

  deploy:
    needs: [changes, site]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
      - name: Stamp the build with the commit
        working-directory: site
        run: echo "$GITHUB_SHA" > dist/_deploy.txt
      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check the served site is this commit
        env:
          URLS: >-
            https://ripen-site.cloudflare-punctual727.workers.dev
            https://ripen.dev
        run: |
          for attempt in $(seq 1 10); do
            settled=1
            for url in $URLS; do
              stamp="$(curl -sS --max-time 20 "$url/_deploy.txt" || true)"
              root="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
              echo "attempt $attempt: $url stamp '$stamp', root $root"
              if [ "$stamp" != "$GITHUB_SHA" ] || [ "$root" != "200" ]; then
                settled=0
              fi
            done
            if [ "$settled" = "1" ]; then
              echo "every host is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "not every host settled on $GITHUB_SHA with a 200 at the root" >&2
          exit 1
