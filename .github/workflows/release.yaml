# Publishes a release from an annotated v* tag: binaries, archives,
# checksums, SBOMs, images on both registries, keyless signatures, and
# build provenance. Nothing here runs on a branch.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload artifacts
      packages: write # push to ghcr
      id-token: write # keyless signing and provenance
      attestations: write # attest what was built

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # See ci.yaml: `go 1.26` in go.mod is a floor, so without this the
      # release is built by whatever Go patch the runner cached. The
      # published binaries are the last place to find that out.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify the tree before publishing anything
        run: |
          go test -race ./...

      # Pinned to an exact version, not a moving major: sigstore stopped
      # publishing the major tag after v3, so `@v4` resolves to nothing
      # and fails the run. v4.x is reachable only as an exact version.
      #
      # It has to be a v4. The v3 installer verifies the cosign it
      # downloads against a detached `<binary>.sig` plus a release public
      # key, and no cosign 3.x publishes one — 3.x ships a Sigstore
      # bundle, `<binary>.sigstore.json`, instead. So v3 cannot install
      # any v3 cosign at all: it 404s on the signature and stops. It was
      # the first thing to fail the release rehearsal (#54), and it could
      # not have failed anywhere else, because `--snapshot` signs nothing
      # and never installs cosign. v4.1.2 knows about the bundle and
      # verifies it with a pinned-digest bootstrap cosign.
      #
      # The cosign-release pin below is separate, and load-bearing.
      # cosign 2.x accepts the pre-v3 signing flags, ignores them and
      # exits 0 — the fail-open that #59 fixed. v3.1.3 is the version
      # that fix was proven against, so it is pinned rather than
      # defaulted. Both actions are pure-shell composites, so neither can
      # be the source of a Node 20 deprecation annotation.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.1.3"
      # v0 is the only major this action has ever had, and it already
      # runs on Node 24.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKERHUB_TOKEN is the only long-lived secret in this workflow.
      # Where it lives, what it can reach, and how it is rotated:
      # docs/release-credentials.md. Provisioned by
      # .github/release/provision-dockerhub.sh, which creates the Docker Hub
      # repository private before anything is ever pushed to it.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The release notes are the hand-written CHANGELOG section for this
      # version. A tag with no section is a tag nobody wrote notes for,
      # and the release stops rather than inventing them from commits.
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { collecting = 1; next }
            collecting && /^## / { exit }
            # Keep a Changelog keeps its link definitions at the end of the
            # file, after the last section -- and the section being released
            # is always that last section. Without this the notes carry them.
            collecting && /^\[[^]]+\]: / { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          # Non-empty, not merely present: a section header with nothing
          # under it collects a blank line, which -s would accept.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat release-notes.md

      # A flake cannot read the tag it was fetched by, so flake.nix carries
      # the version as a constant and `nix run github:...` reports whatever
      # that constant says. A tag that disagrees with it would publish a Nix
      # channel whose binary lies about its own version, so the release stops
      # here rather than shipping one.
      - name: Refuse a tag the flake disagrees with
        run: |
          version="${GITHUB_REF_NAME#v}"
          flake_version="$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix)"
          if [ "$flake_version" != "$version" ]; then
            echo "flake.nix says version \"$flake_version\", tag says \"$version\"" >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance covers what the Release actually carries: the four
      # archives and the checksums file. The raw binaries live in
      # per-target directories under dist/ and are build intermediates
      # nobody downloads, so these globs stay one level deep rather than
      # descending. Attesting the checksums file reaches the SBOMs too —
      # it lists every archive and every SBOM by digest.
      #
      # The images are out of scope here: docker_signs puts a cosign
      # signature on each manifest, which is a different claim.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
