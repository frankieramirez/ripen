name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -euo pipefail {0}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify the tree before publishing anything
        run: |
          go test -race ./...

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.1.3"
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { collecting = 1; next }
            collecting && /^## / { exit }
            collecting && /^\[[^]]+\]: / { exit }
            collecting { print }
          ' CHANGELOG.md | tr -d '\r' > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Refuse a release that cannot be attested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! private="$(gh api "repos/$GITHUB_REPOSITORY" -q .private)"; then
            echo "could not read whether $GITHUB_REPOSITORY is private, so whether" >&2
            echo "this release can carry build provenance is unknown; refusing" >&2
            exit 1
          fi
          if [ "$private" != "false" ]; then
            echo "$GITHUB_REPOSITORY is private, and github does not persist build" >&2
            echo "provenance for user-owned private repositories. readme.md tells" >&2
            echo "people to verify every archive with 'gh attestation verify', so" >&2
            echo "this refuses rather than publish a release that cannot be." >&2
            echo "the repository goes public in phase 6 of docs/rework/checklist.md." >&2
            exit 1
          fi

      - name: Refuse a tag the flake disagrees with
        run: |
          version="${GITHUB_REF_NAME#v}"
          flake_version="$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix)"
          if [ "$flake_version" != "$version" ]; then
            echo "flake.nix says version \"$flake_version\", tag says \"$version\"" >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse a release whose body is not the changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body -q .body | tr -d '\r' > "$RUNNER_TEMP/published-body.md"
          notes_bytes="$(wc -c < "$RUNNER_TEMP/release-notes.md")"
          if ! head -c "$notes_bytes" "$RUNNER_TEMP/published-body.md" \
               | cmp -s - "$RUNNER_TEMP/release-notes.md"; then
            echo "the published release body does not start with the CHANGELOG section" >&2
            echo "--- expected ---" >&2
            cat "$RUNNER_TEMP/release-notes.md" >&2
            echo "--- published ---" >&2
            cat "$RUNNER_TEMP/published-body.md" >&2
            exit 1
          fi

      - name: Attest what was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
