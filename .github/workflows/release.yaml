# Publishes a release from an annotated v* tag: binaries, archives,
# checksums, SBOMs, images on both registries, keyless signatures, and
# build provenance. Nothing here runs on a branch.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload artifacts
      packages: write # push to ghcr
      id-token: write # keyless signing and provenance
      attestations: write # attest what was built

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify the tree before publishing anything
        run: |
          go test -race ./...

      # Deliberately still on v3 while the rest of this file moved to a
      # Node 24 major. sigstore stopped publishing the moving major tag
      # after v3, so `@v4` resolves to nothing and would fail the run —
      # v4.x is reachable only as an exact version. Staying costs nothing
      # here: v3 is a pure-shell composite with no Node runtime, so it
      # cannot be the source of a Node 20 deprecation annotation.
      #
      # The cosign-release pin below is separate, and load-bearing. The
      # action's own default is a cosign 2.x (v2.5.2 at this tag), which
      # accepts the pre-v3 signing flags, ignores them and exits 0 — the
      # fail-open that #59 fixed. v3.1.3 is the version the fix was
      # proven against, so it is pinned rather than defaulted.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v3.1.3"
      # v0 is the only major this action has ever had, and it already
      # runs on Node 24.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The release notes are the hand-written CHANGELOG section for this
      # version. A tag with no section is a tag nobody wrote notes for,
      # and the release stops rather than inventing them from commits.
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat release-notes.md

      # A flake cannot read the tag it was fetched by, so flake.nix carries
      # the version as a constant and `nix run github:...` reports whatever
      # that constant says. A tag that disagrees with it would publish a Nix
      # channel whose binary lies about its own version, so the release stops
      # here rather than shipping one.
      - name: Refuse a tag the flake disagrees with
        run: |
          version="${GITHUB_REF_NAME#v}"
          flake_version="$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix)"
          if [ "$flake_version" != "$version" ]; then
            echo "flake.nix says version \"$flake_version\", tag says \"$version\"" >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance covers what the Release actually carries: the four
      # archives and the checksums file. The raw binaries live in
      # per-target directories under dist/ and are build intermediates
      # nobody downloads, so these globs stay one level deep rather than
      # descending. Attesting the checksums file reaches the SBOMs too —
      # it lists every archive and every SBOM by digest.
      #
      # The images are out of scope here: docker_signs puts a cosign
      # signature on each manifest, which is a different claim.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
