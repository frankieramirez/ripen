# OpenSSF Scorecard. The README carries its badge, and a badge with no
# workflow behind it reports nothing — this is what makes it live.
#
# Merged at the visibility flip, not before: Scorecard cannot analyze a
# private repository, so landing this earlier buys a permanently failing
# job on main. That ordering is docs/rework/CHECKLIST.md, Phase 6.
name: Scorecard

on:
  # Scorecard re-reads branch protection when it changes.
  branch_protection_rule:
  schedule:
    - cron: "26 7 * * 1" # weekly; the exact time only spreads load
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # publish_results signs its provenance
      security-events: write # upload the SARIF to code scanning

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what feeds the badge and the public API; the
          # SARIF upload below is the same data in the Security tab.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
