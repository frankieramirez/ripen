name: Site notify

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - CONTEXT.md
  workflow_run:
    workflows: [Go CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  notify:
    if: github.repository == 'frankieramirez/ripen' && (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          SITE_WORKFLOW_TOKEN: ${{ secrets.SITE_WORKFLOW_TOKEN }}
        with:
          script: |
            const notify = require('./.github/ci/site-notify.cjs')
            await notify(github, context, core, process.env.SITE_WORKFLOW_TOKEN)
