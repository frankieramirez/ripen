# Release configuration for Ripen. `goreleaser build --snapshot` in CI
# cross-compiles the matrix on every push; the full pipeline below runs
# only on an annotated v* tag, from .github/workflows/release.yaml.
#
# Everything published is verifiable: checksums, an SBOM per archive, a
# keyless cosign signature over the checksum file and one on every image,
# and GitHub build provenance attested in the workflow.
version: 2

project_name: ripen

before:
  hooks:
    - go mod tidy

builds:
  - id: ripen
    main: ./cmd/ripen
    binary: ripen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/frankieramirez/ripen/internal/version.Version={{.Version}}
      - -X github.com/frankieramirez/ripen/internal/version.Commit={{.ShortCommit}}
      - -X github.com/frankieramirez/ripen/internal/version.Date={{.Date}}
    # Reproducibility: the binary's timestamp is the commit's, not the
    # moment the release happened to run.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ripen
    ids:
      - ripen
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: docs/schema/v1/*.json
        dst: schema/v1

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

sboms:
  - id: archives
    artifacts: archive

# Keyless signing: the certificate comes from the workflow's OIDC
# identity, so there is no long-lived key to lose. The signature, that
# certificate and the transparency-log proof travel together in one
# Sigstore bundle — the only format cosign v3 writes, and the only one
# its `verify-blob` still reads.
#
# `cmd` is the wrapper rather than cosign itself on purpose. GoReleaser
# does not check that a signing command wrote anything, so a cosign that
# exits 0 having written nothing would register a signature artifact
# that does not exist. The wrapper refuses instead; see the script.
signs:
  - id: checksums
    cmd: ./.github/release/sign-blob.sh
    signature: "${artifact}.sigstore.json"
    args:
      - "${artifact}"
      - "${signature}"
    artifacts: checksum
    output: true

dockers_v2:
  - id: images
    ids:
      - ripen
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/frankieramirez/ripen
      - docker.io/frankieramirez/ripen
    # The exact-version tags always publish. The floating tags do not move
    # onto a release candidate: an empty tag is dropped, so a prerelease
    # leaves `latest`, `vX` and `vX.Y` pointing at the last stable release.
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: Ripen
      org.opencontainers.image.description: Ripen, a fail-closed image updater
      org.opencontainers.image.url: https://github.com/frankieramirez/ripen
      org.opencontainers.image.source: https://github.com/frankieramirez/ripen
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT

docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

# The release notes are the hand-written CHANGELOG section for this tag,
# passed in by the workflow with --release-notes. A changelog is writing,
# not a diff, so nothing here is generated from commits.
#
# There is deliberately no `changelog: disable: true`. It reads like the
# way to turn the commit-log generator off, and it is not: `disable`
# skips the whole changelog pipe, and that pipe is the only thing that
# ever reads --release-notes. With it set, the flag was accepted,
# ignored, and the release published with a body that was nothing but
# the footer below -- the hand-written section silently dropped, and two
# guards in the workflow spent protecting a file nobody read (#54).
#
# --release-notes is what turns generation off: given one, the pipe uses
# it and returns before it can build anything from the git log.

release:
  draft: false
  prerelease: auto
  footer: |
    ---

    Verify a download. Needs cosign v3 — the bundle format below is not
    readable by cosign v2.

    ```
    cosign verify-blob \
      --bundle ripen_{{ .Version }}_checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github\.com/frankieramirez/ripen/\.github/workflows/release\.yaml@refs/tags/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      ripen_{{ .Version }}_checksums.txt
    ```

    That signature covers the checksum file, and the checksum file covers
    every archive and SBOM here. Check what you downloaded against it:

    ```
    sha256sum --ignore-missing -c ripen_{{ .Version }}_checksums.txt
    ```

    On macOS that is `shasum -a 256 --ignore-missing -c`.
